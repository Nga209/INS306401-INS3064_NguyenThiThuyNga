<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phê Duyệt Yêu Cầu | Campus Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/approvals.css">
</head>
<body>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="page-header">
            <div class="header-title">
                <h1>Duyệt đơn đặt chỗ</h1>
                <p>Bạn có <span id="count-pending" style="color: var(--primary); font-weight: 700;">0</span> đơn đang chờ xử lý</p>
            </div>
            <div id="current-date" style="font-weight: 700; color: var(--slate); background: white; padding: 10px 20px; border-radius: 15px; border: 1px solid #f1f5f9;">
                May 2026
            </div>
        </header>

        <div class="bento-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 30%;">Thông tin người đặt</th>
                        <th>Tài nguyên</th>
                        <th>Thời gian sử dụng</th>
                        <th>Trạng thái</th>
                        <th style="text-align: right;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="render-target">
                    <!-- Loading state -->
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 50px; color: var(--slate);">
                            <i class="fas fa-circle-notch fa-spin fa-2x"></i>
                            <p>Đang đồng bộ dữ liệu hệ thống...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        // Khởi tạo Sidebar & Bảo vệ quyền truy cập
        loadSidebar('approvals');
        baoVeTrang(['admin', 'teacher']);

        // Biến toàn cục để lưu trữ dữ liệu hiện tại
        let currentData = [];

        async function fetchAndRender() {
            try {
                // Thử fetch từ API
                const response = await goiApi('/approvals', 'GET');
                
                if (response && response.status === 'success') {
                    currentData = response.data;
                } else {
                    throw new Error("API chưa có dữ liệu");
                }
            } catch (error) {
                console.warn("Sử dụng Mock Data mẫu...");
                // Mock Data dự phòng giống mẫu yêu cầu
                currentData = [
                    { id: 1, fullName: "Nguyễn Thị Thúy Nga", studentCode: "2024001", resource: "Sân Bóng Đá A", date: "03/05/2026", slot: "4 (14h - 16h)", status: "pending" },
                    { id: 2, fullName: "Trần Quốc Đại", studentCode: "2024045", resource: "Hội trường A1", date: "04/05/2026", slot: "2 (09h - 11h)", status: "pending" },
                    { id: 3, fullName: "Nguyễn Thị Huyền Thương", studentCode: "admin", resource: "Phòng Máy 01", date: "15/04/2026", slot: "1 (07h - 09h)", status: "approved" }
                ];
            }

            renderUI();
        }

        function renderUI() {
            const target = document.getElementById('render-target');
            const countLabel = document.getElementById('count-pending');
            
            let html = '';
            let pendingCount = 0;

            currentData.forEach(item => {
                if(item.status === 'pending') pendingCount++;
                
                const displayName = item.booked_for_name || item.fullname || "Người dùng";
                const initial = displayName.charAt(0).toUpperCase();
                
                html += `
                <tr>
                    <td>
                        <div class="profile-box">
                            <div class="avatar">${initial}</div>
                            <div class="name-stack">
                                <b>${displayName}</b>
                                <span>User ID: ${item.user_id}</span>
                            </div>
                        </div>
                    </td>

                    <td><span class="res-tag">${item.resource_name}</span></td>

                    <td>
                        <div class="time-box">${item.booking_date}</div>
                        <span class="time-sub">${item.slot_name}</span>
                    </td>

                    <td>
                        <span class="badge ${getStatusClass(item.status)}">
                            <i class="fas ${getStatusIcon(item.status)}"></i>
                            ${getStatusText(item.status)}
                        </span>
                    </td>

                    <td style="text-align: right;">
                        <div class="action-flex">
                            ${item.status === 'pending' ? `
                                <button class="btn btn-deny" onclick="handleAction(${item.id}, 'rejected')">
                                    <i class="fas fa-times"></i> Từ chối
                                </button>
                                <button class="btn btn-check" onclick="handleAction(${item.id}, 'approved')">
                                    <i class="fas fa-check"></i> Phê duyệt
                                </button>
                            ` : `<span class="done-label">ĐÃ XỬ LÝ</span>`}
                        </div>
                    </td>
                </tr>`;
            });

            target.innerHTML = html;
            countLabel.innerText = pendingCount;
        }

        async function handleAction(id, status) {
            const confirmText = status === 'approved' ? 'phê duyệt' : 'từ chối';
            if (!confirm(`Bạn chắc chắn muốn ${confirmText} yêu cầu này?`)) return;

            try {
                const result = await goiApi('/bookings/approve', 'POST', {
                    booking_id: id,
                    status: status
                });

                if (result.status === 'success') {
                    showToast("Cập nhật thành công", "success");
                    fetchAndRender(); // Gọi lại để lấy data mới nhất từ server
                } else {
                    // Nếu API thất bại (trường hợp demo), cập nhật local để người dùng thấy thay đổi
                    const itemIndex = currentData.findIndex(i => i.id === id);
                    if (itemIndex !== -1) {
                        currentData[itemIndex].status = status;
                        renderUI();
                        showToast("(Demo) Đã cập nhật trạng thái");
                    }
                }
            } catch (error) {
                // Xử lý local nếu không có backend kết nối
                const itemIndex = currentData.findIndex(i => i.id === id);
                if (itemIndex !== -1) {
                    currentData[itemIndex].status = status;
                    renderUI();
                    showToast("(Demo) Đã cập nhật trạng thái");
                }
            }
        }

        // Helper functions
        function getStatusClass(s) {
            return s === 'pending' ? 'st-pending' : (s === 'approved' ? 'st-approved' : 'st-rejected');
        }
        function getStatusIcon(s) {
            return s === 'pending' ? 'fa-clock' : (s === 'approved' ? 'fa-check-circle' : 'fa-times-circle');
        }
        function getStatusText(s) {
            return s === 'pending' ? 'Chờ duyệt' : (s === 'approved' ? 'Đã duyệt' : 'Từ chối');
        }

        // Kết nối Real-time SSE để cập nhật dưới 1 giây
        function ketNoiRealtime() {
            const sseSource = new EventSource(`${DUONG_DAN_GOC}/sse/updates`, { withCredentials: true });

            sseSource.addEventListener('update', (e) => {
                console.log("⚡ [Real-time] Có đơn đặt mới, đang cập nhật danh sách...");
                fetchAndRender();
            });

            sseSource.onerror = () => {
                sseSource.close();
                setTimeout(ketNoiRealtime, 3000);
            };
        }

        // Chạy lần đầu sau khi load trang
        window.addEventListener('DOMContentLoaded', () => {
            fetchAndRender();
            ketNoiRealtime();
        });
    </script>
</body>
</html>
